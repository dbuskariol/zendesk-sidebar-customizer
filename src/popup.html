<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Zendesk Views Tweaks</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Views Tweaks</h1>
    <p class="profile" id="profile-row">
      <span class="profile-label">Profile:</span>
      <span id="profile-current">default</span>
    </p>
    <label><input type="checkbox" id="enabled" /> Enabled</label>
    <label><input type="checkbox" id="compact" /> Compact mode</label>
    <label><input type="checkbox" id="themed" /> Theme overrides</label>
    <label><input type="checkbox" id="reorderEnabled" /> Reorder enabled</label>
    <div class="actions">
      <button type="button" id="open-options">Open options…</button>
    </div>
    <div id="suggest" class="suggest" hidden>
      <p id="suggest-text"></p>
      <button type="button" id="suggest-create">Create profile</button>
      <button type="button" id="suggest-dismiss" class="dismiss">Dismiss</button>
    </div>
    <div id="health" class="health"><span class="health-dot"></span><span id="health-text"></span></div>
    <p class="hint" id="hint">Settings sync across devices.</p>
    <script src="lib.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
